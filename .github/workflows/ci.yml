name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # pr.yml runs it on pull requests, release.yml before it publishes

jobs:
  screenshots:
    name: Simulator build + screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsdl2-dev python3-pil
      - name: Build SDL simulator (compile check)
        run: cmake -S shell -B build/sim -DZS_BACKEND=sim && cmake --build build/sim -j"$(nproc)"
      - name: Build headless
        run: cmake -S shell -B build/headless -DZS_BACKEND=headless && cmake --build build/headless -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build/headless --output-on-failure
      - name: Render every screen (fails if any app crashes)
        run: shell/tools/screenshots.sh build/headless/zeroshell build/screenshots
      - name: Apps as installable modules (fails if one won't load or crashes)
        # The device build loads every non-base app from a module (docs/APPS.md).
        # Same here: no modules installed, then every one installed and opened.
        run: |
          cmake -S shell -B build/modules -DZS_BACKEND=headless -DZS_APPS_AS_MODULES=ON
          cmake --build build/modules -j"$(nproc)"
          shell/tools/modules-test.sh build/modules
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots

  device-test:
    name: Device build, run with a fake screen and keyboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3-pil
      - name: Key translation tests
        run: shell/tests/run.sh
      # The same code the Cardputer runs (framebuffer + evdev keyboard),
      # built for this machine: start it, press keys, check what was typed.
      - name: Build device backend (native)
        run: cmake -S shell -B build/device-native -DZS_BACKEND=device && cmake --build build/device-native -j"$(nproc)"
      - name: Start, navigate and type
        run: |
          gcc -shared -fPIC -o build/fakedev.so shell/tests/device/fakedev.c -ldl
          python3 shell/tests/device/device_test.py build/device-native/zeroshell build/fakedev.so build/device-screens
      # Every app on the home screen, opened with the keyboard: once with the
      # simulated hardware, once with the device's own hardware layer on a
      # machine with no Cardputer hardware and none of the apps' extras.
      - name: Open every app with the keyboard, with and without hardware
        run: python3 shell/tests/device/apps_test.py build/device-native/zeroshell build/fakedev.so build/device-screens/apps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-screens
          path: build/device-screens

  apps-install:
    name: Install every app for real (Debian trixie arm64)
    runs-on: ubuntu-24.04-arm
    # What the Cardputer runs (Raspberry Pi OS is trixie plus Raspberry Pi's
    # repository), with the real apt: every app installs with what it
    # depends on, side by side, and removes cleanly.
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl gpg cmake g++ dpkg-dev python3 file >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # image/version.sh counts commits since the last tag
      - name: Add Raspberry Pi's repository (as on the device)
        run: |
          git config --global --add safe.directory "$PWD"
          # The same key pi-gen installs (image/build.sh pins that commit).
          curl -fsSL -o /usr/share/keyrings/raspberrypi-archive-keyring.pgp \
            https://raw.githubusercontent.com/CardputerZero/pi-gen/e3b4e323782a59a426b92356248f5bc09a098be1/stage0/00-configure-apt/files/raspberrypi-archive-keyring.pgp
          echo 'deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.pgp] http://archive.raspberrypi.com/debian trixie main' \
            > /etc/apt/sources.list.d/raspi.list
          apt-get update -qq
      - name: Build ZeroShell and the app modules
        run: |
          cmake -S shell -B build/device -DZS_BACKEND=device
          cmake --build build/device -j"$(nproc)"
      - name: Package the apps
        run: image/apps/build.sh build/device/apps build/apps
      - name: Install, then remove, every app
        run: image/tests/apps-install-test.sh build/apps build/device/zeroshell

  web:
    name: Browser simulator (WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build
        run: web/build.sh build/zeroos-simulator.html
      - uses: actions/upload-artifact@v4
        with:
          name: zeroos-simulator-html
          path: build/zeroos-simulator.html

  device:
    name: Device build (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # image/version.sh counts commits since the last tag
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y cmake g++-aarch64-linux-gnu
      - name: Build
        run: |
          cmake -S shell -B build/device -DZS_BACKEND=device \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/aarch64-linux-gnu.cmake
          cmake --build build/device -j"$(nproc)"
          aarch64-linux-gnu-strip build/device/zeroshell
          aarch64-linux-gnu-strip --strip-unneeded build/device/apps/*.so
      - uses: actions/upload-artifact@v4
        with:
          name: zeroshell-arm64
          path: build/device/zeroshell
      # The update package (docs/UPDATE.md): send it to a device with
      # tools/push-update.sh to try this build without re-flashing.
      - name: Update tests
        run: image/tests/update-test.sh
      - name: App install tests
        run: image/tests/apps-test.sh
      - name: Router mode tests
        run: image/tests/router-test.sh
      - name: Package
        run: image/package.sh build/device/zeroshell build/update
      - name: Package the apps
        run: image/apps/build.sh build/device/apps build/apps
      - uses: actions/upload-artifact@v4
        with:
          name: zeroos-package
          path: build/update/
      # Every installable app and zeroos-apps.index (docs/APPS.md): try one on
      # a device with: sudo zeroos-apps install-file zeroos-app-<id>_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: zeroos-apps
          path: build/apps/
