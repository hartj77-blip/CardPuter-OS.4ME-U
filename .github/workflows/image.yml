name: Build image

# Builds the flashable ZeroOS .img.xz. It runs on GitHub's arm64 runner (free
# for public repositories), so pi-gen builds the arm64 system natively instead
# of under qemu (estimated 35-45 minutes, was 1.5-3 hours). It runs on pull
# requests that change the image, by hand from the Actions tab, and from the
# Release workflow for every tag, which attaches the image to that release (so
# .../releases/latest/download/zeroos-cardputerzero-arm64.img.xz is always the
# newest image). Not on shell/** changes: ZeroShell reaches devices as the
# update package, which CI builds and tests on every push.
on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''
      apps:
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - image/**
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      wifi_country:
        description: Wi-Fi country code (regulatory domain)
        default: US
        required: true
      release_tag:
        description: Also attach the image to this existing release (e.g. v0.2.0); blank for none
        default: ''
        required: false
      apps:
        description: Apps to preinstall, space-separated (e.g. "notes media"); empty for the bare OS
        default: ''
        required: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: write   # only used to upload to a release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for the version string
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Install dependencies
        run: |
          sudo apt-get update
          # Native arm64 host: plain g++ is the aarch64 compiler (it also
          # provides the aarch64-linux-gnu-* names the toolchain file uses).
          sudo apt-get install -y cmake g++ \
            coreutils quilt parted debootstrap zerofree zip dosfstools libarchive-tools \
            libcap2-bin grep rsync xz-utils file git curl bc gpg pigz xxd arch-test \
            qemu-user-static kmod binfmt-support e2fsprogs
          uname -m
          command -v aarch64-linux-gnu-g++ aarch64-linux-gnu-strip
      - name: Check package names (fast fail, ~3 min)
        # A trixie arm64 container with Raspberry Pi's repository resolves our
        # package list before the hour-long base build starts.
        run: |
          pkgs=$(grep -v '^#' image/stage-zeroos/*-packages | tr '\n' ' ')
          # And what each installable app depends on (image/apps/*.pkg).
          pkgs="$pkgs $(sed -n 's/^DEPENDS="\(.*\)"/\1/p' image/apps/*.pkg | tr ',' '\n' | sed 's/([^)]*)//; s/ //g' | sort -u | tr '\n' ' ')"
          # The same Raspberry Pi archive key pi-gen installs (the old .gpg.key
          # on the archive is SHA-1 signed and rejected by trixie's apt).
          curl -fsSL -o /tmp/rpi.pgp https://raw.githubusercontent.com/CardputerZero/pi-gen/e3b4e323782a59a426b92356248f5bc09a098be1/stage0/00-configure-apt/files/raspberrypi-archive-keyring.pgp
          docker run --rm --platform linux/arm64 -v /tmp/rpi.pgp:/usr/share/keyrings/rpi.gpg:ro debian:trixie sh -euc "
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates >/dev/null
            echo 'deb [signed-by=/usr/share/keyrings/rpi.gpg] http://archive.raspberrypi.com/debian trixie main' > /etc/apt/sources.list.d/rpi.list
            curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg
            curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list
            curl -fsSL https://download.opensuse.org/repositories/network:/Meshtastic:/beta/Debian_13/Release.key -o /usr/share/keyrings/meshtastic.asc
            echo 'deb [signed-by=/usr/share/keyrings/meshtastic.asc] http://download.opensuse.org/repositories/network:/Meshtastic:/beta/Debian_13/ /' > /etc/apt/sources.list.d/meshtastic.list
            apt-get update -qq
            apt-get install -s $pkgs > /tmp/plan.txt
            grep -c '^Inst' /tmp/plan.txt"
      - name: Build ZeroShell (arm64)
        run: |
          cmake -S shell -B build/device -DZS_BACKEND=device \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/aarch64-linux-gnu.cmake
          cmake --build build/device -j"$(nproc)"
          aarch64-linux-gnu-strip build/device/zeroshell
          aarch64-linux-gnu-strip --strip-unneeded build/device/apps/*.so
      - name: Build apps
        run: image/apps/build.sh build/device/apps build/apps
      - name: Build image
        env:
          WIFI_COUNTRY: ${{ inputs.wifi_country || 'US' }}
          ZEROOS_APPS: ${{ inputs.apps }}
          PIGEN_NATIVE: 1
          # xz -3 with all cores: much faster than pi-gen's default -6 for a
          # slightly bigger download.
          COMPRESSION_LEVEL: 3
        run: image/build.sh build/device/zeroshell
      - name: Image contents check
        run: |
          ls -la build/image/pi-gen/deploy/
          sudo tail -40 build/image/pi-gen/deploy/build.log || true
          # Optional parts report themselves in the log; show how they went.
          sudo grep -h "zeroos: " build/image/pi-gen/deploy/build.log build/image/pi-gen/work/*/build.log 2>/dev/null | sort -u || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeroos-image
          path: |
            build/image/pi-gen/deploy/*.img.xz
            build/image/pi-gen/deploy/*.info
            build/image/pi-gen/deploy/build.log
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          # A fixed name, so the "latest" download link never changes.
          mkdir -p build/release
          img=$(ls build/image/pi-gen/deploy/*.img.xz | head -1)
          cp "$img" build/release/zeroos-cardputerzero-arm64.img.xz
          (cd build/release && sha256sum zeroos-cardputerzero-arm64.img.xz > zeroos-cardputerzero-arm64.img.xz.sha256)
          cat build/release/*.sha256
          gh release upload "$TAG" build/release/* --clobber --repo "$GITHUB_REPOSITORY"
