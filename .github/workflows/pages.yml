name: Pages

# Publishes the browser simulator to GitHub Pages on every push to main:
# https://hartj77-blip.github.io/CardPuter-OS.4ME-U/
# Needs Settings > Pages > Source set to "GitHub Actions" (once).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the simulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build
        run: |
          mkdir -p site
          web/build.sh site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
