# ZeroOS: keep a small log on the SD card, so a boot that goes wrong (blank
# screen, no network) can be read afterwards by putting the card in a PC:
#   journalctl -D <card>/var/log/journal -b
# Capped to keep SD writes low. M5's image also keeps a persistent log.
[Journal]
Storage=persistent
SystemMaxUse=24M
RuntimeMaxUse=16M
