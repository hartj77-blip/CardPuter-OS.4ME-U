# Where zeroos-update looks for updates (docs/UPDATE.md). The address must
# serve zeroos-update.manifest and the package it names. To take updates from
# a PC on your own network instead, point this at it, for example:
#   UPDATE_URL=http://192.168.1.20:8000
# Plain http is only accepted for addresses on your own network (private
# IPs, Tailscale, .local/.lan names). Anyone who can serve this address can
# install anything, so for any other http address you must also say:
#   ALLOW_HTTP=1
UPDATE_URL=https://github.com/hartj77-blip/CardPuter-OS.4ME-U/releases/latest/download
