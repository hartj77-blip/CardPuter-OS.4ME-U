# ZeroOS: removed once pi's password is changed from the default
# (/usr/lib/zeroos/password-check). Everyone knows the default password, so
# until then SSH takes keys only: a password login would let anyone on the
# same network in before the owner, and ForceCommand alone doesn't stop
# "ssh -N" port forwarding. Key logins (a key added in Raspberry Pi Imager)
# work as usual. Change the password on the device (Terminal app) and
# password logins work again.
PasswordAuthentication no
KbdInteractiveAuthentication no
ForceCommand /usr/lib/zeroos/first-password ssh
ExposeAuthInfo yes
