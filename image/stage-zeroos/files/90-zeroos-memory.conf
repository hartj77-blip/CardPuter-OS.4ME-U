# ZeroOS memory tuning for 512 MB with zram swap (docs/PERFORMANCE.md).
# Swap to zram eagerly. zram is RAM-speed, much faster than re-reading files
# from the SD card, so values above 100 tell the kernel to prefer it.
vm.swappiness=150
# Read one page at a time from swap. Read-ahead helps a disk, not zram.
vm.page-cluster=0
# Keep directory and inode caches a little longer (file browsing, shells).
vm.vfs_cache_pressure=80
# Keep 8 MB free so the kernel can always allocate for the display and Wi-Fi.
vm.min_free_kbytes=8192
# Start background reclaim a little earlier (1.25% of RAM) so apps rarely
# stall reclaiming memory themselves, and skip the extra reclaim bursts the
# kernel does after fragmentation, which mostly churn zram on small boards.
vm.watermark_scale_factor=125
vm.watermark_boost_factor=0
