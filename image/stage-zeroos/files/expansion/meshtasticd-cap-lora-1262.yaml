# ZeroOS: M5Stack Cap LoRa-1262 on the CardputerZero's EXT port
# (docs/EXPANSION.md). SX1262 on SPI0 CE1 (GPIO 7, /dev/spidev0.1), as in
# Meshtastic's own config for this board (lora-cardputer-zero.yaml) and M5's
# LoRa app. The 5 V and the antenna switch (an IO expander on the cap) aren't
# set here: zeroos-mesh-cap-power does that before meshtasticd starts.
Lora:
  Module: sx1262
  spidev: spidev0.1   # the kernel drives CE1; no CS pin. The LCD is on CE0.
  spiSpeed: 1000000
  gpiochip: 0
  Reset: 26
  Busy: 22
  IRQ: 23
  DIO2_AS_RF_SWITCH: true
  # The cap's TCXO runs at 3.0 V. "true" would mean 1.8 V, too low for it to
  # start, and the radio then fails to come up.
  DIO3_TCXO_VOLTAGE: 3.0

# No GPS section: meshtasticd (2.7) can't read gpsd, only a serial port
# (GPS: SerialPath). gpsd already owns /dev/serial0 for ZeroShell's GPS app
# and tracks, and two readers on one UART garble each other, so the mesh
# node has no position of its own. Set a fixed one in the web client if
# you want it on the map.

# The Meshtastic web client, for chatting from a phone or the Dock browser.
Webserver:
  Port: 9443
  RootPath: /usr/share/meshtasticd/web

General:
  MaxNodes: 100
