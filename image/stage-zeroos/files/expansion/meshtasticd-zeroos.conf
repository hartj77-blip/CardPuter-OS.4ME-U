# ZeroOS: meshtasticd is started by the Mesh app, never at boot.
[Service]
# Power the cap and switch its antenna in, as root, before every start.
ExecStartPre=+/usr/lib/zeroos/mesh-cap-power
# The web client and API have no login: before it listens, keep them to this
# device and your tailnet (Mesh's "Allow phones" opens them). If the
# firewall can't be set, it doesn't start.
ExecStartPre=+/usr/lib/zeroos/mesh-firewall close
ExecStopPost=+/usr/lib/zeroos/mesh-firewall clear
Nice=5
# earlyoom and the kernel take it before ZeroShell or the dock.
OOMScoreAdjust=300
